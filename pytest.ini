[pytest]
# The service modules sit at the repo root, so tests import them by name.
# `bin` is added the same way, for the Python scripts under bin/ that a
# test imports rather than execs as a subprocess (cert_expiry_check.py,
# measure_retrieval_quality.py); bin/install-library is shell and tested
# via subprocess.
pythonpath = . bin
testpaths = tests
