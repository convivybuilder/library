[alembic]
script_location = alembic

# NO `sqlalchemy.url` HERE, and its absence is a control rather than an omission.
# A URL in this file would be a second answer to "which database", sitting beside
# `store`'s — and the wrong one would point at Orient's live control database,
# which is the failure the whole `LIBRARY_DB` resolution exists to prevent.
# `alembic/env.py` asks `store` instead, and refuses unless `LIBRARY_DB` named the
# file.

# Version files are named `<rev>_<slug>.py`. No date prefix: the tree is short and
# the revision chain already carries the order, where a date claims one it does
# not have.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO, not WARNING: alembic's own output is how an operator running the cutover
# sees which revision was applied or stamped, and a stamp that printed nothing
# would be a step nobody could confirm.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
